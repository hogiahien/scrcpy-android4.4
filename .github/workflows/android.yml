name: Build scrcpy (Android 4.4 fork)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_COMPILE_API: "33"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev \
            libswresample-dev libusb-1.0-0-dev libsdl2-dev adb \
            openjdk-17-jdk unzip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_API}" \
            "build-tools;34.0.0"

      - name: Build client and server
        run: |
          meson setup build --buildtype release --strip -Db_lto=true
          ninja -C build

      - name: Test client
        run: meson test -C build --print-errorlogs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-build
          path: |
            build/app/scrcpy
            build/server/scrcpy-server.jar
            server/build/outputs/**/*

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-SDL2

      - name: Build Windows client
        shell: msys2 {0}
        run: |
          meson setup build --buildtype release --strip -Db_lto=true -Dbuild_server=false
          ninja -C build

      - name: Test Windows client
        shell: msys2 {0}
        run: meson test -C build --print-errorlogs

      - name: Package Windows client
        shell: msys2 {0}
        run: |
          mkdir -p dist/scrcpy-windows
          cp build/app/scrcpy.exe dist/scrcpy-windows/
          ldd build/app/scrcpy.exe | awk '{print $3}' | grep '^/mingw64/bin/.*\.dll$' | sort -u | xargs -r -I{} cp {} dist/scrcpy-windows/

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-windows-client
          path: dist/scrcpy-windows
